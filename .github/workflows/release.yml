name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.artifacts.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Linux / LLVM 18 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 llvm-18 lld-18 bc bison flex \
            libssl-dev libelf-dev libzstd-dev zlib1g-dev dwarves pkg-config \
            python3 git zip unzip rsync cpio file xz-utils zstd
          mkdir -p ci-logs

      - name: 宿主回归（无需手机）
        run: python3 -m unittest discover -s 自动化测试矩阵/host -p 'test_*.py' -v 2>&1 | tee ci-logs/host-tests.log

      - name: 拉取固定提交的内核源码
        run: bash fetch-kernel.sh 2>&1 | tee ci-logs/fetch-kernel.log

      - name: 配置内核并准备外部模块构建
        run: bash 自动化测试矩阵/prepare-kernel.sh 2>&1 | tee ci-logs/prepare-kernel.log

      - name: 从当前源码编译、验证并打包
        run: |
          bash 自动化测试矩阵/build.sh 2>&1 | tee ci-logs/build.log
          python3 自动化测试矩阵/host/build_metadata.py verify

      - name: 整理构建产物及摘要
        id: artifacts
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' 模块源目录/module.prop)"
          mkdir -p dist
          # Release 资产使用 ASCII 名；模块包内容仍由 build.sh 唯一生成。
          cp "一加13解容-v${VERSION}.zip" dist/op13-battery-unlock.zip
          cp 模块源目录/uv2800.ko 模块源目录/uv2800.build.json dist/
          cp 编译用内核树/android_kernel_oneplus_sm8750/.config dist/kernel.config
          git rev-parse HEAD > dist/source-commit.txt
          (cd dist && sha256sum op13-battery-unlock.zip uv2800.ko uv2800.build.json kernel.config source-commit.txt > SHA256SUMS)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cat dist/SHA256SUMS

      - name: 上传模块和构建清单
        uses: actions/upload-artifact@v4
        with:
          name: module-build
          path: dist/
          if-no-files-found: error

      - name: 保留配置差异和诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            ci-logs/
            编译用内核树/android_kernel_oneplus_sm8750/.config
            编译用内核树/android_kernel_oneplus_sm8750/config.diff
          include-hidden-files: true
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: 下载本次源码构建的产物
        uses: actions/download-artifact@v4
        with:
          name: module-build
          path: dist

      - name: 核对下载产物
        run: cd dist && sha256sum -c SHA256SUMS

      - name: 发布 Release（仅 v* tag push）
        uses: softprops/action-gh-release@v2
        with:
          name: 一加13解容 uv2800 v${{ needs.build.outputs.version }}
          files: |
            dist/op13-battery-unlock.zip
            dist/uv2800.ko
            dist/uv2800.build.json
            dist/kernel.config
            dist/source-commit.txt
            dist/SHA256SUMS
          body_path: RELEASE-NOTES.md
          generate_release_notes: true
