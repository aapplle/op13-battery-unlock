name: Release

# 发布流程：从 `模块源目录/` 打包出可刷入的 zip，并作为 Release 资产发布。
#
#   · push tag（v*）  → 打包 + 建 Release
#   · 手动触发        → 只打包，产物在 Actions 的 Artifacts 里
#
# 说明：
#  1) 本工作流【不重新编译】—— `模块源目录/uv2800.ko` 随仓库提交，且自 v11 起逐字节未变。
#     若改动了 `内核源码/uv2800.c`，请先在本地运行 `自动化测试矩阵/build.sh`
#     （它会拉内核树、编译、同步 .ko 进 `模块源目录/`）并提交新的 .ko，再打 tag。
#     编译步骤见 THIRD-PARTY-NOTICES.md §1.4。
#  2) 资产名**必须用 ASCII**：softprops/action-gh-release 会把非 ASCII 文件名截坏
#     （实测 `一加13解容-v11.zip` → `13.-v11.zip`）。zip 内容不受影响，刷入时文件名无所谓。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 从 模块源目录/ 构建 zip
        id: build
        run: |
          set -euo pipefail
          VER="$(grep '^version=' 模块源目录/module.prop | cut -d= -f2)"
          VCODE="$(grep '^versionCode=' 模块源目录/module.prop | cut -d= -f2)"
          # 资产名固定为 ASCII：action-gh-release 会把非 ASCII 文件名截坏
          NAME="op13-battery-unlock.zip"
          rm -f "$NAME"
          ( cd 模块源目录 && zip -q -r "$GITHUB_WORKSPACE/$NAME" . -x '*.prev' )
          MD5="$(md5sum "$NAME" | cut -d' ' -f1)"
          echo "name=$NAME"     >> "$GITHUB_OUTPUT"
          echo "ver=$VER"       >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE"   >> "$GITHUB_OUTPUT"
          echo "md5=$MD5"       >> "$GITHUB_OUTPUT"
          echo "=== 产物 ==="
          ls -la "$NAME"
          echo "$MD5  $NAME"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ steps.build.outputs.name }}
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 一加13解容 uv2800 v${{ steps.build.outputs.ver }}
          files: ${{ steps.build.outputs.name }}
          body_path: RELEASE-NOTES.md
          generate_release_notes: true
